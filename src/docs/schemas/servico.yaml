
componentes:
  schemas:
    # schema/servico.yaml
    Servico:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: "servico sentinela"
        descricao:
          type: string
          example: "Servico de sentinela profissional para residência e trabalho"
        categoria:
          type: string
          example: "Limpeza"
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          example: "2022-01-01T00:00:00Z "
        updated_at:
          type: string
          example: "2022-01-01T00:00:00Z "

    #schema para criar um novo servico
    CreateServico:
      type: object
      properties:
        nome:
          type: string
          example: servico sentinela 
        descricao:
          type: string
          example: Servico de sentinela profissional para residência e trabalho
        categoria:
          type: string
          example: Limpeza
        enabled:
          type: boolean
          example: true

    # shema generico para sucesso
    ResponseSuccess:
    type: object
    properties:
      message:
        type: string
        example: "Servicos encontrados com sucesso"
      status:
        type: bolean
        example: true
      data:
        type: object
        $ref: '#/components/schemas/Servico'

    # schema generico de resposta de erro
    ResponseError:
      type: object
      properties:
        message:
          type: string
          example: "Error ao buscar servicos"
        status:
          type: bolean
          example: false
        data:
          type: object
          properties:
            null

