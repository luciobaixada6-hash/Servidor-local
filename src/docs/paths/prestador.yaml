paths:
  /prestador:
    get:
      summary: Listar todos os prestador
      tags:
        - Prestador
      description: Retorna uma lista de todos os prestador disponiveis
      responses:
        "200":
          description: Listar prestador
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prestador"
        "404":
          description: Nenhum Prestador encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestador/create:
    post:
      summary: Criar um novo prestador
      tags:
        - Prestador
      description: Cria um novo prestador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrestador"
      responses:
        "200":
          description: Prestador criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Erro ao criar prestador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestador/get-by-id/{id}:
    get:
      summary: Buscar um prestador por ID
      tags:
        - Prestador
      description: Retorna um prestador especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestador
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Prestador encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Prestador não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestador/update/{id}:
    put:
      summary: Atualizar um prestador
      tags:
        - Prestador
      description: Atualiza um prestador especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestador a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrestador"
      responses:
        "200":
          description: Prestador atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Prestador não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestador/delete/{id}:
    delete:
      summary: Apagar um prestador
      tags:
        - Prestador
      description: Apaga um prestador especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestador a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Prestador deletado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Prestador não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
