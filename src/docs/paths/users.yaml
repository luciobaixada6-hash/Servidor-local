paths:
  /Users:
    get:
      summary: Listar todos os Users
      tags:
        - Users
      description: Retorna uma lista de todos os Users disponiveis
      responses:
        "200":
          description: Listar Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Users"
        "404":
          description: Nenhum Users encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /Users/create:
    post:
      summary: Criar um novo Users
      tags:
        - Users
      description: Cria um novo Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUsers"
      responses:
        "200":
          description: Users criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Erro ao criar Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /Users/get-by-id/{id}:
    get:
      summary: Buscar um Users por ID
      tags:
        - Users
      description: Retorna um Users especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do Users
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Users encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Users não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /Users/update/{id}:
    put:
      summary: Atualizar um Users
      tags:
        - Users
      description: Atualiza um Users especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do Users a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUsers"
      responses:
        "200":
          description: Users atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Users não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /Users/delete/{id}:
    delete:
      summary: Apagar um Users
      tags:
        - Users
      description: Apaga um Users especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do Users a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Users deletado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Users não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /Users/login:
    post:
      summary: Login de um utilizador
      tags:
        - Users
      description: Realizar o login de um utilizador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUsers"
      responses:
        "200":
          description: "Login realizado com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponseSuccess"
        "400":
          description: "Dados invalidos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponseError"
        "404":
          description: "error ao logar utilizador"    
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponseError"