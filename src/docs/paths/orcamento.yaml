paths:
  /orcamento:
    get:
      summary: Listar todos os orcamento
      tags:
        - Orçamento
      description: Retorna uma lista de todos os orcamento disponiveis
      responses:
        "200":
          description: Listar orcamento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Orcamento"
        "404":
          description: Nenhum Orcamento encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamento/create:
    post:
      summary: atualizar orcamento
      tags:
      - Orçamento
      description: Cria um novo orcamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrcamento"
      responses:
        "200":
          description: Orcamento criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Erro ao criar orcamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamento/get-by-id/{id}:
    get:
      summary: Buscar um orcamento por ID
      tags:
        - Orçamento
      description: Retorna um orcamento especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orcamento
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Orcamento encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Orcamento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamento/update/{id}:
    put:
      summary: Atualizar um orcamento
      tags:
      - Orçamento 
      description: Atualiza um orcamento especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orcamento a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrcamento"
      responses:
        "200":
          description: Orcamento atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Orcamento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamento/delete/{id}:
    delete:
      summary: Apagar um orcamento
      tags:
      - Orçamento
      description: Apaga um orcamento especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orcamento a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Orcamento deletado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Orcamento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"