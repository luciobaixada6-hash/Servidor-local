paths:
  /prestacao-servico:
    get:
      summary: Listar todos os prestacao-servico
      tags:
          - Prestacao-Servico
      description: Retorna uma lista de todos os prestacao-servico disponiveis
      responses:
        "200":
          description: Listar prestacao-servico
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/prestacao-servico"
        "404":
          description: Nenhum prestacao-servico encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestacao-servico/create:
    post:
      summary: Criar um novo prestacao-servico
      tags:
          - Prestacao-Servico
      description: Cria um novo prestacao-servico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Createprestacao-servico"
      responses:
        "200":
          description: prestacao-servico criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Erro ao criar prestacao-servico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestacao-servico/get-by-id/{id}:
    get:
      summary: Buscar um prestacao-servico por ID
      tags:
        - Prestacao-Servico
      description: Retorna um prestacao-servico especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestacao-servico
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: prestacao-servico encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: prestacao-servico não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestacao-servico/update/{id}:
    put:
      summary: Atualizar um prestacao-servico
      tags:
          - Prestacao-Servico
      description: Atualiza um prestacao-servico especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestacao-servico a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Create-prestacao-servico"
      responses:
        "200":
          description: prestacao-servico atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: prestacao-servico não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestacao-servico/delete/{id}:
    delete:
      summary: Apagar um prestacao-servico
      tags:
        - Prestacao-Servico
      description: Apaga um prestacao-servico especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestacao-servico a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: prestacao-servico deletado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: prestacao-servico não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestacao-servico/get-all-detalhado:
    get:
      summary: Listar todos os prestacao-servico detalhado
      tags:
          - Prestacao-Servico
      description: Retorna uma lista de todos os prestacao-servico detalhada
      parameters:
        - name: lmit
          in: query
          required: false
          shema:
            type: string
            example: "10"
        - name: offset
          in: query
          required: false
          shema:
            type: string
            example: "0"
      responses:
        "200":
          description: Prestacao-servico detalhado entrado com sucesso
          content:
            application/json:
              schema:
                  $ref: "#/components/schemas/ResponseSuccess"
      "500":
        description: Erro ao busc ar prestacao-servico detalhado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseError"

