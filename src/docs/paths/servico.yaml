paths:
  /servico/all-details:
    get:
      summary: Listar todos os servicos detalhados
      tags:
        - Servico
      description: Retorna uma lista de todos os servico disponiveis com detalhes
      parameters:
        - name: limit
          in: query
          required: false
          description: Limite de servicos a serem retornados
          schema:
            type: integer
            example: 10
        - name: offset
          in: query
          required: false
          description: offset de servicos a serem retornados
          schema:
            type: integer
            example: 0
      responses:
        "200":
          description: Listar servico detalhados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Servico"
        "404":
          description: Nenhum Servico encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /servico/create:
    post:
      summary: Criar um novo servico
      tags:
        - Servico
      description: Cria um novo servico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServico"
      responses:
        "200":
          description: Servico criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Erro ao criar servico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /servico/get-by-id/{id}:
    get:
      summary: Buscar um servico por ID
      tags:
        - Servico
      description: Retorna um servico especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do servico
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Servico encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Servico não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /servico/update/{id}:
    put:
      summary: Atualizar um servico
      tags:
        - Servico
      description: Atualiza um servico especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do servico a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServico"
      responses:
        "200":
          description: Servico atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Servico não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /servico/delete/{id}:
    delete:
      summary: Apagar um servico
      tags:
        - Servico
      description: Apaga um servico especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do servico a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Servico deletado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Servico não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
