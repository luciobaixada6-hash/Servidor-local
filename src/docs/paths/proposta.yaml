paths:
  /proposta:
    get:
      summary: Listar todos os proposta
      tags:
        - Proposta
      description: Retorna uma lista de todos os proposta disponiveis
      responses:
        "200":
          description: Listar proposta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposta"
        "404":
          description: Nenhum Proposta encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /proposta/create:
    post:
      summary: Criar um novo proposta
      tags:
        - Proposta
      description: Cria um novo proposta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposta"
      responses:
        "200":
          description: Proposta criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Erro ao criar proposta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /proposta/get-by-id/{id}:
    get:
      summary: Buscar um proposta por ID
      tags:
        - Proposta
      description: Retorna um proposta especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do proposta
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Proposta encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Proposta não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /proposta/update/{id}:
    put:
      summary: Atualizar um proposta
      tags:
      - Proposta
      description: Atualiza um proposta especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do proposta a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposta"
      responses:
        "200":
          description: Proposta atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Proposta não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /proposta/delete/{id}:
    delete:
      summary: Apagar um proposta
      tags:
        - Proposta
      description: Apaga um proposta especifico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do proposta a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Proposta deletado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Proposta não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
